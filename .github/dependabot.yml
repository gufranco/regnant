version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directories:
      - /ami/docker
      - /services/auth-sidecar
      - /services/backend-bitbucket-clone
      - /services/backend-confluence-clone
      - /services/backend-jira-clone
      - /services/cli
      - /services/osb
      - /services/ratelimit
      - /services/sovereign
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: pip
    directories:
      - /services/backend-bitbucket-clone
      - /services/backend-confluence-clone
      - /services/backend-jira-clone
      - /services/osb
      - /services/sdk/python
      - /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directories:
      - /envoy/filters/ab-router
      - /envoy/filters/header-rewriter
      - /envoy/filters/request-id-injector
      - /services/auth-sidecar
      - /services/cli
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /tests/terratest
    schedule:
      interval: weekly
    groups:
      aws-sdk-go-v2:
        patterns:
          - github.com/aws/*

  - package-ecosystem: terraform
    directories:
      - /terraform/envs/local
      - /terraform/modules/*
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        group-by: dependency-name
        patterns:
          - "*"
