name: release

on:
  workflow_run:
    workflows: [build, test, lint]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ready:
    name: Ready to release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Build, test and lint all passed for the commit main still holds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest() {
            gh api "repos/$REPO/actions/workflows/$1/runs?head_sha=$SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_number) | last
                    | if . == null then "none" else "\(.status)/\(.conclusion)" end'
          }
          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          build="$(latest build.yml)"
          test="$(latest test.yml)"
          lint="$(latest lint.yml)"
          echo "main $head; build $build, test $test, lint $lint for $SHA"
          ready=false
          if [ "$head" = "$SHA" ] \
            && [ "$build" = "completed/success" ] \
            && [ "$test" = "completed/success" ] \
            && [ "$lint" = "completed/success" ]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  release:
    name: Version and publish
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
