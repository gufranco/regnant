[package]
name = "regnant-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "Developer CLI for the regnant Open Service Broker"
repository = "https://github.com/gufranco/regnant"

[[bin]]
name = "regnant"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
anyhow = "1.0.104"
thiserror = "2.0.21"
tabled = "0.22"
keyring = "4.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }
base64 = "0.23.1"

[dev-dependencies]
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
