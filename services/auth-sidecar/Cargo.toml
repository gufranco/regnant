[package]
name = "regnant-auth-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Envoy ext_authz sidecar that validates JWTs against Keycloak"
repository = "https://github.com/gufranco/regnant"

[[bin]]
name = "auth-sidecar"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tonic = "0.14.9"
prost = "0.14.5"
prost-types = "0.14.5"
envoy-types = "0.7.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jsonwebtoken = "11.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
parking_lot = "0.13"
once_cell = "1.21.4"
async-trait = "0.1.92"
thiserror = "2.0.21"
anyhow = "1.0.104"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
